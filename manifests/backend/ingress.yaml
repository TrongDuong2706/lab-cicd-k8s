apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dev-backend-ingress
  namespace: my-app
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  rules:
  - host: trongduong.website
    http:
      paths:
      - path: /dev(/|$)(api)(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: dev-backend
            port:
              number: 80
