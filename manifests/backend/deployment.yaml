apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: my-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: duongtrong27/lab-cicd-backend:latest
        ports:
        - containerPort: 80
        env:
        - name: DB_HOST
          value: "postgres"
        envFrom:
        - secretRef:
            name: postgres-secret
