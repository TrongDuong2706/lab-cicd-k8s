apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-dev
  namespace: my-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-dev
  template:
    metadata:
      labels:
        app: frontend-dev
    spec:
      imagePullSecrets:
        - name: ecr-regcred
      containers:
      - name: frontend
        image: 980921740481.dkr.ecr.ap-southeast-1.amazonaws.com/frontend:dff7828
        ports:
        - containerPort: 80
        env:
        - name: APP_API_HOST
          value: "backend-dev"
        - name: APP_API_PORT
          value: "80"