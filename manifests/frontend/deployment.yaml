apiVersion: apps/v1
kind: Deployment
metadata:
  name: prod-frontend
  namespace: my-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prod-frontend
  template:
    metadata:
      labels:
        app: prod-frontend
    spec:
      imagePullSecrets:
        - name: ecr-regcred
      containers:
      - name: frontend
        image: 980921740481.dkr.ecr.ap-southeast-1.amazonaws.com/frontend:0e2cdb5
        ports:
        - containerPort: 80
        env:
        - name: APP_API_HOST
          value: "prod-backend"
        - name: APP_API_PORT
          value: "80"