apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-dev-ingress
  namespace: my-app
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - host: dev.trongduong.website
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-dev
            port:
              number: 80