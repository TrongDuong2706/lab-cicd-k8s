apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress-dev
  namespace: my-app
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - host: trongduong.website
    http:
      paths:
      - path: /dev
        pathType: Prefix
        backend:
          service:
            name: dev-frontend-svc
            port:
              number: 80
      - path: /uat
        pathType: Prefix
        backend:
          service:
            name: uat-frontend-svc
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: prod-frontend-svc
            port:
              number: 80
