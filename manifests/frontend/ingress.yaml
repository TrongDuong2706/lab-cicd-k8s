apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prod-frontend-ingress
  namespace: my-app
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - host: trongduong.website
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: prod-frontend
            port:
              number: 80